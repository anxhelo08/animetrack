name: Publish AnimeTrack 11.6
on:
  push:
    branches: [main]
    paths:
      - '.release/11-6.ready'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply exact release
        shell: bash
        run: |
          set -euo pipefail
          cat .release/11-6-part{1..7}.b64 | base64 --decode | xz --decompress > /tmp/animetrack-11-6.patch
          echo 'bf3b84184497b0f42c0b3cfa5fb7f0c626506f1c0a16bb8adce504e99030f2f1  /tmp/animetrack-11-6.patch' | sha256sum --check
          git apply --check /tmp/animetrack-11-6.patch
          git apply /tmp/animetrack-11-6.patch
          npm test
          for x in assets/app.js assets/pro-profiles.js assets/pro-friends.js assets/pro-import-116.js assets/pro-mobile-113.js tests/auth-browser.cjs; do node --check "$x"; done
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium webkit
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/animetrack-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/ >/dev/null
          node tests/auth-browser.cjs
          BROWSER=webkit node tests/auth-browser.cjs
          BROWSER=desktop node tests/auth-browser.cjs
          # The automation token cannot modify workflow files. Browser checks already ran above.
          git restore .github/workflows/test.yml
          git add RELEASE_11_6.md assets/app.js assets/pro-features.js assets/pro-friends.js assets/pro-import-116.js assets/pro-mobile-113.js assets/pro-profiles.js assets/pro-social-auth-116.css index.html package.json sw.js tests/auth-browser.cjs tests/pro-smoke.test.cjs
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AnimeTrack 11.6: social, analytics and reliable account onboarding'
          git push origin HEAD:main
