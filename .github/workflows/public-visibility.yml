name: Public visibility monitor

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animetrack-public-visibility
  cancel-in-progress: false

jobs:
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - name: Check public availability and discovery
        run: npm run check:public
      - name: Publish check summary
        if: always()
        run: |
          if [ -f public-visibility-report.md ]; then cat public-visibility-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: public-visibility-report
          path: |
            public-visibility-report.json
            public-visibility-report.md
          retention-days: 30
