name: Public visibility monitor

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animetrack-public-visibility
  cancel-in-progress: false

jobs:
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - name: Check public availability and discovery
        run: npm run check:public
      - name: Publish check summary
        if: always()
        run: |
          if [ -f public-visibility-report.md ]; then cat public-visibility-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: public-visibility-report
          path: |
            public-visibility-report.json
            public-visibility-report.md
          retention-days: 30
