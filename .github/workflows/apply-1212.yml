name: Publish AnimeTrack 12.12.0
on:
  push:
    branches: [main]
    paths:
      - '.release/12-12.ready'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply exact release
        shell: bash
        run: |
          set -euo pipefail
          cat .release/12-12-part{1..7}.b64 | base64 --decode | xz --decompress > /tmp/animetrack-12-12.patch
          echo 'fa545178963a4889a463e97894655a4f9397c997219046d522a65b66e66b8e7a  /tmp/animetrack-12-12.patch' | sha256sum --check
          git apply --check /tmp/animetrack-12-12.patch
          git apply /tmp/animetrack-12-12.patch
          npm test
          node --check assets/app.js
          node --check assets/pro-franchise-1212.js
          node --check assets/pro-tv-118.js
          git add README.md RELEASE_12_12_0.md assets/app.js assets/pro-franchise-1212.js assets/pro-tv-118.js index.html package.json sw.js tests/episode-hub-127.test.cjs tests/filler-1210.test.cjs tests/franchise-1212.test.cjs tests/pro-smoke.test.cjs tests/pwa-126.test.cjs tests/seasonal-128.test.cjs tests/storage-1274.test.cjs tests/sync-126.test.cjs tests/workflow-124.test.cjs tests/wrapped-129.test.cjs tests/year-125.test.cjs
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AnimeTrack 12.12.0: chronological franchise timelines'
          git push origin HEAD:main
