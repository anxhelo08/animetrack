name: AnimeTrack CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: animetrack-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unit:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install pinned toolchain
        run: npm ci --no-audit --no-fund
      - name: Security lint and format checks
        run: npm run lint && npm run format:check
      - name: Dependency security audit
        run: npm run audit
      - name: Unit tests and Vite production build
        run: npm test
      - name: Verify content-hashed production assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -Eq '/assets/[^" ]+\.[A-Za-z0-9_-]{6,}\.(js|css)' dist/index.html
          ! grep -Eq 'pro-[a-z-]+-[0-9]+\.(js|css)' dist/index.html
      - name: Package tested release source
        id: package
        shell: bash
        run: |
          LABEL=$(node -p "require('./package.json').releaseLabel || require('./package.json').version")
          ZIP="AnimeTrack-${LABEL}.zip"
          zip -r "$ZIP" . -x ".git/*" "node_modules/*" "playwright-report/*" "test-results/*" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: animetrack-release
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

  database-security:
    name: PostgreSQL restore + RLS + lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: animetrack_security_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:disposable-ci-password@127.0.0.1:5432/animetrack_security_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - name: Restore catalogue baseline and verify RLS behavior
        run: npm run test:db
      - name: Install PostgreSQL function checker
        run: |
          docker exec -u root ${{ job.services.postgres.id }} bash -c 'apt-get update -qq && apt-get install -y --no-install-recommends postgresql-17 postgresql-17-plpgsql-check'
          docker restart ${{ job.services.postgres.id }}
          for attempt in $(seq 1 30); do docker exec ${{ job.services.postgres.id }} pg_isready -U postgres && break; sleep 1; done
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d animetrack_security_test -c 'CREATE EXTENSION plpgsql_check'
      - name: Lint restored application schemas
        run: npx supabase db lint --db-url "$DATABASE_URL" --schema public,private,animetrack_private --level warning --fail-on error

  e2e:
    name: E2E · ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [build-unit, database-security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
          - project: iphone-chromium
            browser: chromium
          - project: iphone-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install pinned toolchain
        run: npm ci --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright Test
        run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
