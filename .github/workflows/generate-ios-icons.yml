name: Generate iPhone PWA icons
on:
  push:
    branches: [feat/iphone-app-10-5]
    paths:
      - 'scripts/generate-icons.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generate-icons.py
      - name: Commit PWA icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "assets: generate dedicated iPhone and PWA PNG icons" && git push)
