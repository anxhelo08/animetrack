name: AnimeTrack checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  iphone-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Start local site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/animetrack-http.log 2>&1 &
          echo $! > /tmp/animetrack-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/ >/dev/null
      - run: node tests/iphone-browser.cjs
      - run: BROWSER=webkit node tests/iphone-browser.cjs
      - name: Register, confirm and sign in — Chromium iPhone
        run: node tests/auth-browser.cjs
      - name: Register, confirm and sign in — WebKit iPhone
        run: BROWSER=webkit node tests/auth-browser.cjs

  desktop-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/animetrack-desktop-http.log 2>&1 &
          echo $! > /tmp/animetrack-desktop-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/ >/dev/null
      - run: node tests/desktop-browser.cjs
      - name: Register, confirm and sign in — desktop
        run: BROWSER=desktop node tests/auth-browser.cjs
